name: numerical-contract
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and mathematical checks
        run: python -m unittest discover -s tests -v
      - name: Independent implementation comparison
        run: python run.py verify --cases 40
      - name: Reproduction smoke
        run: python run.py experiment --neurons 8 --horizon 32 --repeats 1 --output results/local-ci.json
